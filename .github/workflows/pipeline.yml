# =============================================================================
# Pipeline CI/CD — Backend LTI
# =============================================================================
#
# Flujo: Test → Build → Deploy (EC2)
#
# Disparador:
#   Solo se ejecuta cuando hay actividad en un Pull Request abierto (apertura,
#   nuevos commits en la rama del PR o reapertura). Un push a la rama del PR
#   dispara el evento "synchronize".
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   - AWS_ACCESS_ID       : Access Key ID de AWS
#   - AWS_ACCESS_KEY      : Secret Access Key de AWS
#   - EC2_INSTANCE        : IP pública o DNS de la instancia EC2
#   - EC2_SSH_PRIVATE_KEY : Clave privada PEM para SSH (usuario ubuntu)
#
# Prerrequisitos en EC2:
#   - Node.js y npm instalados
#   - PM2 instalado globalmente (npm install -g pm2)
#   - Directorio de despliegue creado (por defecto: /home/ubuntu/lti-backend)
#   - Archivo .env con DATABASE_URL en el directorio de despliegue
#   - PostgreSQL accesible desde la instancia
#
# Nota de seguridad:
#   Los jobs con secretos no se ejecutan en PRs desde forks externos.
# =============================================================================

name: Backend CI/CD Pipeline

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  NODE_VERSION: "20"
  BACKEND_DIR: backend
  # Ruta remota en EC2 donde se despliega el backend
  EC2_DEPLOY_PATH: /home/ubuntu/lti-backend
  # Usuario SSH por defecto en Ubuntu AMI
  EC2_SSH_USER: ubuntu

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # Instala dependencias, levanta PostgreSQL en el runner y ejecuta la suite
  # completa de tests (unitarios + integración). Si algún test falla, el job
  # termina con error y los jobs posteriores no se ejecutan (needs: test).
  # ---------------------------------------------------------------------------
  test:
    name: "1 — Test"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          # Credenciales alineadas con backend/prisma/schema.prisma
          POSTGRES_USER: LTIdbUser
          POSTGRES_PASSWORD: D1ymf8wyQEGthFR1E9xhCq
          POSTGRES_DB: LTIdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U LTIdbUser -d LTIdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: ${{ env.BACKEND_DIR }}
        run: npx prisma generate

      - name: Aplicar migraciones de base de datos
        working-directory: ${{ env.BACKEND_DIR }}
        run: npx prisma migrate deploy

      - name: Ejecutar suite de tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm test

      - name: Publicar resultados JUnit (referencia CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.BACKEND_DIR }}/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 — Build
  # Compila TypeScript (npm run build → carpeta dist/) y publica el artefacto
  # de despliegue con actions/upload-artifact. Solo se ejecuta si Test pasó.
  # ---------------------------------------------------------------------------
  build:
    name: "2 — Build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: ${{ env.BACKEND_DIR }}
        run: npx prisma generate

      - name: Compilar backend (TypeScript → dist/)
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run build

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            ${{ env.BACKEND_DIR }}/dist/
            ${{ env.BACKEND_DIR }}/package.json
            ${{ env.BACKEND_DIR }}/package-lock.json
            ${{ env.BACKEND_DIR }}/prisma/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3 — Deploy a EC2
  # Descarga el artefacto generado en Build, lo transfiere por SCP y reinicia
  # la aplicación en EC2 vía SSH usando los secretos configurados.
  # Solo se ejecuta si Build finalizó correctamente.
  # ---------------------------------------------------------------------------
  deploy:
    name: "3 — Deploy EC2"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: deploy-package

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Configurar clave SSH para EC2
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_INSTANCE }}" >> ~/.ssh/known_hosts

      - name: Transferir artefacto a EC2 (SCP)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ env.EC2_SSH_USER }}@${{ secrets.EC2_INSTANCE }} \
            "mkdir -p ${{ env.EC2_DEPLOY_PATH }}"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            deploy-package/* \
            ${{ env.EC2_SSH_USER }}@${{ secrets.EC2_INSTANCE }}:${{ env.EC2_DEPLOY_PATH }}/

      - name: Instalar dependencias y reiniciar aplicación en EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ env.EC2_SSH_USER }}@${{ secrets.EC2_INSTANCE }} << ENDSSH
          set -euo pipefail
          cd "${{ env.EC2_DEPLOY_PATH }}"

          npm ci --omit=dev
          npx prisma generate
          npx prisma migrate deploy

          if pm2 describe lti-backend > /dev/null 2>&1; then
            pm2 restart lti-backend
          else
            pm2 start dist/index.js --name lti-backend
          fi

          pm2 save
          ENDSSH
